# More Stratagem Slots settings. Changes apply the next time the game starts.

# Stratagem slots in the loadout, 4 to 20. When they don't all fit in the game's stratagem list (16 including its
# own, like Reinforce and Resupply), they are split into pages.
slots = 8

# Slots per row on the loadout screen, 4 to 20.
per_row = 4

# Keys for the previous and next page, while the stratagem list is open. A letter, a digit, or a Windows
# virtual-key code.
page_prev = Q
page_next = E

# Lets the mouse wheel switch pages while the stratagem list is open (on or off): wheel up is the previous page,
# wheel down the next one. With page_wheel_invert on it is the other way around.
page_wheel = on
page_wheel_invert = off

# Stops you from switching pages while a stratagem is in your hand or being called in (on). With off you can switch
# at any time, and a stratagem in your hand stays in the list until it has been called in.
page_lock = off

# Puts stratagems that other mods add to your list during a mission in the pages after your own (on). With off they
# stay on every page, which leaves less room for yours.
page_added = on

# Shows Eagle Rearm on every page once an Eagle has spent a use (on). With off it only shows on pages that hold an
# Eagle.
page_rearm = on
