# More Stratagem Slots settings. Changes apply the next time the game starts.

# Stratagem slots in the loadout, 4 to 20. Those that don't fit in the game's stratagem list are split into pages.
slots = 8

# Loadout screen: a loadout of collapse_rows rows of four or more (2 to 5) shows its first row, and a bar that
# shows and hides the others. With collapse off, every row always shows.
collapse = on
collapse_rows = 3

# Keys for the previous and next page, while the stratagem list is open: a letter, a digit, or a Windows
# virtual-key code.
page_prev = Q
page_next = E

# The mouse wheel switches pages too: wheel up is the next page, or the previous one with page_wheel_invert on.
page_wheel = on
page_wheel_invert = off

# Pages, each on or off:
# page_lock: no switching while a stratagem is in your hand or being called in.
# page_added: stratagems that other mods add during a mission go after your pages, not on every page.
# page_rearm: Eagle Rearm shows on every page once an Eagle has spent a use, not only on pages with an Eagle.
page_lock = off
page_added = on
page_rearm = on
