# More Stratagem Slots settings. Read once when the game starts.

# Stratagem slots in the loadout, 4 to 20.
# In a mission the game's stratagem list (the one you see holding the stratagem key) holds 16 in all, its own
# included (Reinforce, SOS Beacon, Resupply, mission stratagems, Eagle Rearm). When your picks don't fit with those,
# they go in pages: page 1 is slots 1 to k, page 2 the next k, and so on (k = 14 minus the game's own, usually 10 or
# so; two rows stay free for what the mission grants). Only the page shown can be called in. Each stratagem keeps its
# uses and cooldown while it is on another page. Eagles on every page share their cooldown and Eagle Rearm, as they
# do in the list. While a stratagem is being called in, the page doesn't change (its row would show the next page's
# stratagem as the one coming in); try again after.
slots = 8

# Slots per row on the loadout card, at least 4. The card grows upwards by a row for each row of extra slots: slots
# 1-4 stay the top row, the rest go in rows under them. With slots <= per_row they are all one row instead, the extra
# ones after the booster box (past the card's right edge, where the game cuts them off).
per_row = 4

# Page keys, while the stratagem list is open: one letter or digit, or a Windows virtual-key code (two digits or
# more).
page_prev = Q
page_next = E

# The mouse wheel changes pages too while the list is open: up = previous page, down = next. While it does, the mod
# tries to keep the wheel from the game (on or off).
page_wheel = on

# While a stratagem of the page shown is being called in (or is in hand), the page doesn't change (on). With off it
# changes at once: the stratagem still comes in, but until it lands its row shows the new page's stratagem as the
# one coming in.
page_hold = on

# Stratagems that other mods add to your list during a mission (P.S.S. extras, for example) go in the pages after
# your own (on). With off they stay on every page, which leaves less room for yours on each page. The mission's own
# (Reinforce, Resupply, SOS Beacon, objective stratagems) are on every page either way.
page_added = on

# Eagle Rearm shows on every page once an Eagle has spent a use, so you can rearm from any page (on). With off it
# shows only on the pages that hold an Eagle. Either way it rearms the Eagles on every page.
page_rearm = on
